# Configuración del Jupyter Book
# https://jupyterbook.org/customize/config.html

title: Tarea 1 — Evaluación de modelos ML
author: Jaime Andres Besada, Ivan Prada

# El notebook NO se re-ejecuta al construir el libro: se usan las salidas guardadas.
# (Una ejecución completa tarda ~6 horas y requiere los CSV originales de ~1.7 GB, que no están en el repositorio.)
execute:
  execute_notebooks: 'off'

# Solo se construyen los archivos listados en _toc.yml
only_build_toc_files: true

latex:
  latex_documents:
    targetname: book.tex

repository:
  url: https://github.com/BESADAJ/Tarea-1-evaluacion-de-modelos-ML
  path_to_book: docs
  branch: main

html:
  use_issues_button: true
  use_repository_button: true
